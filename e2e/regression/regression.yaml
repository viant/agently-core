---
init:
  repoPath: $WorkingDirectory(./..)
  testdataPath: ${repoPath}/e2e/query/testdata
  ownedRoot: ${env.CORE_ENDLY_ROOT}
  workspacePath: ${ownedRoot}/workspace/.agently
  serverPort: 29501
  serverURL: http://127.0.0.1:29501
  authServerPort: 29502
  authServerURL: http://127.0.0.1:29502
  sdkKey: configured
  jwtPubKey: ${ownedRoot}/jwt/public.pem
  jwtPrivKey: ${ownedRoot}/jwt/private.pem
  aguiProbeURL: http://127.0.0.1:29516
pipeline:
  requireBinaries:
    action: exec:run
    description: verify required e2e binaries are prebuilt
    checkError: true
    commands:
    - |
      missing=""
      for bin in datly agently-app mcp-resources mcp-elicitation-form mcp-elicitation-oob mcp-approval-tool mcp-large-result agui-probe; do
        path="${repoPath}/e2e/bin/${bin}"
        if [ ! -x "$path" ]; then
          missing="${missing} ${path}"
        fi
      done
      if [ -n "$missing" ]; then
        echo "missing required binaries:${missing}"
        echo "build them with: cd ${repoPath}/e2e/build && endly -r build.yaml"
        exit 1
      fi
  prepareWorkspace:
    action: exec:run
    description: reset e2e workspace fixtures from testdata
    checkError: true
    commands:
    - "${repoPath}/e2e/scripts/prepare_workspace.sh ${repoPath} ${workspacePath} ${testdataPath}"
  prepareJWT:
    action: exec:run
    description: generate plain RSA keys for e2e auth host
    checkError: true
    commands:
    - mkdir -p ${ownedRoot}/jwt
    - umask 077; openssl genrsa -out ${jwtPrivKey}
      2048
    - openssl rsa -in ${jwtPrivKey} -pubout
      -out ${jwtPubKey}
  mcpResources:
    start:
      when: "$debugger!=on"
      action: exec:run
      checkError: true
      commands:
      - "${repoPath}/e2e/scripts/owned_endly_start.sh 29511 ${repoPath}/e2e/bin/mcp-resources
        -port=29511 -mode=resources"
  mcpElicitationForm:
    start:
      when: "$debugger!=on"
      action: exec:run
      checkError: true
      commands:
      - "${repoPath}/e2e/scripts/owned_endly_start.sh 29512 ${repoPath}/e2e/bin/mcp-elicitation-form
        -port=29512 -mode=elicitation_form"
  mcpElicitationOOB:
    start:
      when: "$debugger!=on"
      action: exec:run
      checkError: true
      commands:
      - "${repoPath}/e2e/scripts/owned_endly_start.sh 29513 ${repoPath}/e2e/bin/mcp-elicitation-oob
        -port=29513 -mode=elicitation_oob"
  mcpApprovalTool:
    start:
      when: "$debugger!=on"
      action: exec:run
      checkError: true
      commands:
      - "${repoPath}/e2e/scripts/owned_endly_start.sh 29514 ${repoPath}/e2e/bin/mcp-approval-tool
        -port=29514 -mode=approval_tool"
  mcpLargeResult:
    start:
      when: "$debugger!=on"
      action: exec:run
      checkError: true
      commands:
      - "${repoPath}/e2e/scripts/owned_endly_start.sh 29515 ${repoPath}/e2e/bin/mcp-large-result -port=29515 -mode=large_result"
  aguiProbe:
    start:
      when: "$debugger!=on"
      action: exec:run
      checkError: true
      commands:
      - "${repoPath}/e2e/scripts/owned_endly_start.sh 29516 ${repoPath}/e2e/bin/agui-probe -port=29516"
  app:
    start:
      when: "$debugger!=on"
      action: exec:run
      checkError: true
      commands:
      - "${repoPath}/e2e/scripts/owned_endly_start.sh 29501 ${repoPath}/e2e/bin/agently-app
        serve --addr 127.0.0.1:29501"
      - "${repoPath}/e2e/scripts/owned_endly_start.sh 29502 ${repoPath}/e2e/bin/agently-app
        serve --addr 127.0.0.1:29502 --jwt-pub ${jwtPubKey}
        --jwt-priv ${jwtPrivKey}"
  health:
    action: http/runner:send
    description: verify target server health endpoint
    requests:
    - Method: GET
      URL: "${serverURL}/healthz"
      Expect:
        Code: 200
        JSONBody:
          status: ok
  testCases:
    tag: "$pathMatch"
    subPath: cases/${index}_*
    template:
      ensureServer:
        action: http/runner:send
        description: ensure e2e server health before each case
        requests:
        - Method: GET
          URL: "${serverURL}/healthz"
          Expect:
            Code: 200
            JSONBody:
              status: ok
      checkSkip:
        action: nop
        skip: "$HasResource(${path}/skip.txt)"
      runTest:
        action: run
        init:
          parentPath: "$path"
          repoPath: "$repoPath"
          serverURL: "$serverURL"
          authServerURL: "$authServerURL"
          sdkKey: "$sdkKey"
          jwtPrivKey: "$jwtPrivKey"
          tag: "$tag"
          aguiProbeURL: "$aguiProbeURL"
        request: "@test"
