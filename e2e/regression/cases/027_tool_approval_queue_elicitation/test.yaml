pipeline:
  mintCanonicalOwner:
    action: secret:signJWT
    expiryInSec: 3600
    PrivateKey:
      URL: ${jwtPrivKey}
    claimsMap:
      sub: e2e-queue-user
      email: e2e-queue-user@example.test
  createConversation:
    when: $sdkKey != ''
    action: http/runner:send
    description: tool approval queue + elicitation - create conversation
    requests:
    - Method: POST
      URL: ${authServerURL}/v1/conversations
      JSONBody:
        AgentID: mcp_form_queue_probe
        Title: queue-elicitation
      Expect:
        Code: 200
        JSONBody:
          '@exists@id': true
      Header:
        Authorization:
        - Bearer ${mintCanonicalOwner.TokenString}
  startQueuedToolQuery:
    when: $sdkKey != ''
    action: http/runner:send
    description: tool approval queue + elicitation - start query that should queue
      MCP form tool
    requests:
    - Method: POST
      URL: ${aguiProbeURL}/run
      Header:
        Connection:
        - close
        Authorization:
        - Bearer ${mintCanonicalOwner.TokenString}
      JSONBody:
        target: ${authServerURL}
        probeId: 027_tool_approval_queue_elicitation-startQueuedToolQuery
        query:
          conversationID: ${createConversation.Responses[0].JSONBody.id}
          agentID: mcp_form_queue_probe
          query: collect my favorite color through the form tool
  waitPendingToolApproval:
    when: $sdkKey != ''
    action: nop
    sleepTimeMs: 3000
  waitUntilPendingToolApproval:
    when: $sdkKey != ''
    action: http/runner:send
    description: tool approval queue + elicitation - wait until pending approval appears
    requests:
    - Method: GET
      URL: ${authServerURL}/v1/tool-approvals/pending?userId=e2e-queue-user&conversationId=${createConversation.Responses[0].JSONBody.id}
      Expect:
        Code: 200
        JSONBody:
          '@exists@rows[0]': true
      Header:
        Authorization:
        - Bearer ${mintCanonicalOwner.TokenString}
