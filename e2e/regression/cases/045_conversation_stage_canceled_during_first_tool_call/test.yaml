init:
  turnSuffix: $FormatTime('now', 'yyyyMMdd-HHmmss-SSS')
pipeline:
  mintCanonicalOwner:
    action: secret:signJWT
    expiryInSec: 3600
    PrivateKey:
      URL: ${jwtPrivKey}
    claimsMap:
      sub: e2e-stage-test
      email: e2e-stage-test@example.test
  createConversation:
    when: $sdkKey != ''
    action: http/runner:send
    description: conversation stage canceled during first tool call - create conversation
    requests:
    - Method: POST
      URL: ${authServerURL}/v1/conversations
      JSONBody:
        AgentID: tool_forcer_exec_sleep
        Title: conversation-stage-canceled-during-first-tool-call-e2e
      Expect:
        Code: 200
        JSONBody:
          '@exists@id': true
      Header:
        Authorization:
        - Bearer ${mintCanonicalOwner.TokenString}
  runAndCancel:
    multiAction: true
    startSleepTurn:
      when: $sdkKey != ''
      action: http/runner:send
      Async: true
      description: conversation stage canceled during first tool call - start sleep
        turn asynchronously
      requests:
      - Method: POST
        URL: ${aguiProbeURL}/run
        Header:
          Connection:
          - close
          Authorization:
          - Bearer ${mintCanonicalOwner.TokenString}
        JSONBody:
          target: ${authServerURL}
          probeId: 045_conversation_stage_canceled_during_first_tool_call-startSleepTurn
          query:
            conversationID: ${createConversation.Responses[0].JSONBody.id}
            agentID: tool_forcer_exec_sleep
            messageID: e2e-stage-running-turn-${turnSuffix}
            query: run sleep tool
    waitForToolActivation:
      when: $sdkKey != ''
      action: nop
      sleepTimeMs: 12000
    observeActiveNativeTurn:
      action: http/runner:send
      requests:
      - Method: GET
        URL: ${aguiProbeURL}/observe/045_conversation_stage_canceled_during_first_tool_call-startSleepTurn
        Header:
          Authorization: ["Bearer ${mintCanonicalOwner.TokenString}"]
        Expect:
          Code: 200
          JSONBody:
            '@exists@identity.nativeTurnId': true
    cancelRunningTurn:
      when: $sdkKey != ''
      action: http/runner:send
      description: conversation stage canceled during first tool call - cancel the
        active running turn
      requests:
      - Method: POST
        URL: ${authServerURL}/v1/turns/${observeActiveNativeTurn.Responses[0].JSONBody.identity.nativeTurnId}/cancel
        Expect:
          Code: 200
        Header:
          Authorization:
          - Bearer ${mintCanonicalOwner.TokenString}
  waitForCancelPersistence:
    when: $sdkKey != ''
    action: nop
    sleepTimeMs: 1200
  getConversation:
    when: $sdkKey != ''
    action: http/runner:send
    description: conversation stage canceled during first tool call - conversation
      and latest turn should be canceled
    requests:
    - Method: GET
      URL: ${authServerURL}/v1/conversations/${createConversation.Responses[0].JSONBody.id}
      Expect:
        Code: 200
        JSONBody:
          id: ${createConversation.Responses[0].JSONBody.id}

      Header:
        Authorization:
        - Bearer ${mintCanonicalOwner.TokenString}

  verifyCanceledNativeTurn:
    action: http/runner:send
    requests:
    - Method: GET
      URL: ${aguiProbeURL}/observe/045_conversation_stage_canceled_during_first_tool_call-startSleepTurn
      Header:
        Authorization: ["Bearer ${mintCanonicalOwner.TokenString}"]
      Expect:
        Code: 200
        JSONBody:
          rootTurn:
            turnId: ${observeActiveNativeTurn.Responses[0].JSONBody.identity.nativeTurnId}
            status: canceled
