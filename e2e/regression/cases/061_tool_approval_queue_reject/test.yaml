pipeline:
  mintCanonicalOwner:
    action: secret:signJWT
    expiryInSec: 3600
    PrivateKey:
      URL: ${jwtPrivKey}
    claimsMap:
      sub: e2e-queue-reject
      email: e2e-queue-reject@example.test
  createConversation:
    when: $sdkKey != ''
    action: http/runner:send
    description: tool approval queue reject - create conversation
    requests:
    - Method: POST
      URL: ${authServerURL}/v1/conversations
      JSONBody:
        AgentID: approval_queue_probe
        Title: queue-reject-e2e
      Expect:
        Code: 200
        JSONBody:
          '@exists@id': true
      Header:
        Authorization:
        - Bearer ${mintCanonicalOwner.TokenString}
  startQueuedQuery:
    when: $sdkKey != ''
    action: http/runner:send
    description: tool approval queue reject - start query
    requests:
    - Method: POST
      URL: ${aguiProbeURL}/run
      Header:
        Connection:
        - close
        Authorization:
        - Bearer ${mintCanonicalOwner.TokenString}
      JSONBody:
        target: ${authServerURL}
        probeId: 061_tool_approval_queue_reject-startQueuedQuery
        query:
          conversationID: ${createConversation.Responses[0].JSONBody.id}
          agentID: approval_queue_probe
          query: run the approval test tool
      Expect:
        Code: 200
        JSONBody:
          outcome:
            type: interrupt
  waitForQueue:
    when: $sdkKey != ''
    action: nop
    sleepTimeMs: 3000
  listPendingApprovals:
    when: $sdkKey != ''
    action: http/runner:send
    description: tool approval queue reject - verify pending approval
    requests:
    - Method: GET
      URL: ${authServerURL}/v1/tool-approvals/pending?userId=e2e-queue-reject&conversationId=${createConversation.Responses[0].JSONBody.id}
      Expect:
        Code: 200
        JSONBody:
          '@exists@rows[0]': true
      Header:
        Authorization:
        - Bearer ${mintCanonicalOwner.TokenString}
  rejectToolCall:
    when: $sdkKey != ''
    action: http/runner:send
    description: tool approval queue reject - reject the queued tool call
    requests:
    - Method: POST
      URL: ${authServerURL}/v1/tool-approvals/${listPendingApprovals.Responses[0].JSONBody.rows[0].id}/decision
      JSONBody:
        action: reject
        reason: e2e rejection test
        userId: e2e-queue-reject
      Expect:
        Code: 200
        JSONBody:
          status: ok
          protocol:
            '@exists@continuationRunId': true
            '@exists@remainingInterruptIds[0]': false
      Header:
        Authorization:
        - Bearer ${mintCanonicalOwner.TokenString}
  collectApprovalContinuation:
    when: $sdkKey != ''
    action: http/runner:send
    description: observe the successor owned by the actual HTTP approval command
    requests:
    - Method: POST
      URL: ${aguiProbeURL}/run
      Header:
        Authorization:
        - Bearer ${mintCanonicalOwner.TokenString}
      JSONBody:
        target: ${authServerURL}
        probeId: approval-continuation-61
        nativeConversationId: ${createConversation.Responses[0].JSONBody.id}
        attach:
          threadId: ${rejectToolCall.Responses[0].JSONBody.protocol.threadId}
          runId: ${rejectToolCall.Responses[0].JSONBody.protocol.continuationRunId}
      Expect:
        Code: 200
        JSONBody:
          outcome:
            type: success
