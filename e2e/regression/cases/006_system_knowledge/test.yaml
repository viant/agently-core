pipeline:
  mintCanonicalOwner:
    action: secret:signJWT
    expiryInSec: 3600
    PrivateKey:
      URL: ${jwtPrivKey}
    claimsMap:
      sub: e2e-test
      email: e2e-test@example.test
  query:
    when: $sdkKey != ''
    action: http/runner:send
    description: system knowledge - Go error handling
    requests:
    - Method: POST
      URL: ${aguiProbeURL}/run
      Header:
        Connection:
        - close
        Authorization:
        - Bearer ${mintCanonicalOwner.TokenString}
      JSONBody:
        target: ${authServerURL}
        probeId: 006_system_knowledge-query
        query:
          agentID: knowledge_system
          query: What are the Go error handling best practices?
      Expect:
        Code: 200
        JSONBody:
          '@exists@identity.nativeConversationId': true
          assistantText: /error/
