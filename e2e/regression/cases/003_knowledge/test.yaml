pipeline:
  mintCanonicalOwner:
    action: secret:signJWT
    expiryInSec: 3600
    PrivateKey:
      URL: ${jwtPrivKey}
    claimsMap:
      sub: e2e-test
      email: e2e-test@example.test
  knowledge:
    when: $sdkKey != ''
    action: http/runner:send
    description: agent knowledge - local knowledge retrieval
    requests:
    - Method: POST
      URL: ${aguiProbeURL}/run
      Header:
        Connection:
        - close
        Authorization:
        - Bearer ${mintCanonicalOwner.TokenString}
      JSONBody:
        target: ${authServerURL}
        probeId: 003_knowledge-knowledge
        query:
          agentID: knowledge_local
          query: What products does Viant make?
      Expect:
        Code: 200
        JSONBody:
          '@exists@identity.nativeConversationId': true
          assistantText: /atly/
