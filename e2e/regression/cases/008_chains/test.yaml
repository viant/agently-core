pipeline:
  mintCanonicalOwner:
    action: secret:signJWT
    expiryInSec: 3600
    PrivateKey:
      URL: ${jwtPrivKey}
    claimsMap:
      sub: e2e-test
      email: e2e-test@example.test
  query:
    when: $sdkKey != ''
    action: http/runner:send
    description: chains - parent query triggers child
    requests:
    - Method: POST
      URL: ${aguiProbeURL}/run
      Header:
        Connection:
        - close
        Authorization:
        - Bearer ${mintCanonicalOwner.TokenString}
      JSONBody:
        target: ${authServerURL}
        probeId: 008_chains-query
        query:
          agentID: chain_parent
          query: What are the three primary colors?
      Expect:
        Code: 200
        JSONBody:
          '@exists@identity.nativeConversationId': true
          '@exists@assistantText': true
  getMessages:
    when: $sdkKey != ''
    action: http/runner:send
    description: chains - verify child response in messages
    requests:
    - Method: GET
      URL: ${authServerURL}/v1/messages?conversationId=${query.Responses[0].JSONBody.identity.nativeConversationId}
      Expect:
        Code: 200
        JSONBody:
          '@exists@Rows': true
      Header:
        Authorization:
        - Bearer ${mintCanonicalOwner.TokenString}
