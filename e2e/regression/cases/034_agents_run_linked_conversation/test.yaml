pipeline:
  mintCanonicalOwner:
    action: secret:signJWT
    expiryInSec: 3600
    PrivateKey:
      URL: ${jwtPrivKey}
    claimsMap:
      sub: e2e-test
      email: e2e-test@example.test
  runDelegation:
    when: $sdkKey != ''
    action: http/runner:send
    TimeoutMs: 240000
    description: agents-run link - execute delegated run
    requests:
    - Method: POST
      URL: ${aguiProbeURL}/run
      Header:
        Connection:
        - close
        Authorization:
        - Bearer ${mintCanonicalOwner.TokenString}
      JSONBody:
        target: ${authServerURL}
        probeId: 034_agents_run_linked_conversation-runDelegation
        query:
          agentID: tool_forcer_agents_run
          query: Delegate once using llm/agents:run.
      Expect:
        Code: 200
        JSONBody:
          '@exists@identity.nativeConversationId': true
  getLinkedToolMessage:
    when: $sdkKey != ''
    action: http/runner:send
    description: agents-run link - parent transcript includes linked conversation
      id
    requests:
    - Method: GET
      URL: ${authServerURL}/v1/messages?conversationId=${runDelegation.Responses[0].JSONBody.identity.nativeConversationId}&types=tool_op
      Expect:
        Code: 200
        JSONBody:
          '@exists@Rows[0].linkedConversationId': true
      Header:
        Authorization:
        - Bearer ${mintCanonicalOwner.TokenString}
  verifyChildConversation:
    when: $sdkKey != ''
    action: nop
    description: agents-run link - linked child conversation exists
