pipeline:
  conversationsNoAuth:
    action: http/runner:send
    description: auth - unauthenticated GET /v1/conversations should return 401
    requests:
    - Method: GET
      URL: ${authServerURL}/v1/conversations
      Expect:
        Code: 401
  queryNoAuth:
    action: http/runner:send
    description: auth - unauthenticated POST /v1/ag-ui/run should return 401
    requests:
    - Method: POST
      URL: ${authServerURL}/v1/ag-ui/run
      JSONBody:
        threadId: auth-denied-thread
        runId: auth-denied-run
        messages:
        - id: auth-denied-message
          role: user
          content: Hello
        forwardedProps:
          agently:
            version: "1"
            operation: chat
            payload:
              agentId: simple
      Expect:
        Code: 401
  transcriptNoAuth:
    action: http/runner:send
    description: auth - unauthenticated GET /v1/conversations/x/transcript should
      return 401
    requests:
    - Method: GET
      URL: ${authServerURL}/v1/conversations/nonexistent/transcript
      Expect:
        Code: 401
