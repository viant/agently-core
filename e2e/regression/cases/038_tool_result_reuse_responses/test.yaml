pipeline:
  mintCanonicalOwner:
    action: secret:signJWT
    expiryInSec: 3600
    PrivateKey:
      URL: ${jwtPrivKey}
    claimsMap:
      sub: e2e-test
      email: e2e-test@example.test
  setupTurn1:
    when: $sdkKey != ''
    action: http/runner:send
    TimeoutMs: 240000
    description: tool result reuse responses - seed HOME and USER with Responses model
    requests:
    - Method: POST
      URL: ${aguiProbeURL}/run
      Header:
        Connection:
        - close
        Authorization:
        - Bearer ${mintCanonicalOwner.TokenString}
      JSONBody:
        target: ${authServerURL}
        probeId: 038_tool_result_reuse_responses-setupTurn1
        query:
          agentID: tool_env_seed_user_only
          query: Check HOME and USER environment variables, but present only USER.
          model: openai_gpt4o_mini_responses
      Expect:
        Code: 200
        JSONBody:
          '@exists@identity.nativeConversationId': true
          '@exists@rootTurn.assistant.final.messageId': true
          assistantText: /USER=/
  verifyToolTurn1:
    when: $sdkKey != ''
    action: http/runner:send
    description: tool result reuse responses - first turn should emit a tool_op
    requests:
    - Method: GET
      URL: ${authServerURL}/v1/messages?conversationId=${setupTurn1.Responses[0].JSONBody.identity.nativeConversationId}&types=tool_op
      Expect:
        Code: 200
        JSONBody:
          '@exists@Rows[0]': true
      Header:
        Authorization:
        - Bearer ${mintCanonicalOwner.TokenString}
  probeTurn2:
    when: $sdkKey != ''
    action: http/runner:send
    TimeoutMs: 240000
    description: tool result reuse responses - second turn should answer HOME from
      prior tool result
    requests:
    - Method: POST
      URL: ${aguiProbeURL}/run
      Header:
        Connection:
        - close
        Authorization:
        - Bearer ${mintCanonicalOwner.TokenString}
      JSONBody:
        target: ${authServerURL}
        probeId: 038_tool_result_reuse_responses-probeTurn2
        query:
          agentID: tool_env_reuse_home
          conversationID: ${setupTurn1.Responses[0].JSONBody.identity.nativeConversationId}
          query: What is HOME?
          model: openai_gpt4o_mini_responses
          toolCallExposure: conversation
      Expect:
        Code: 200
        JSONBody:
          '@exists@rootTurn.assistant.final.messageId': true
          assistantText: /HOME=/
  turn2Message:
    when: $sdkKey != ''
    action: http/runner:send
    description: tool result reuse responses - resolve turn2 id from response message
      id
    requests:
    - Method: GET
      URL: ${authServerURL}/v1/messages?conversationId=${setupTurn1.Responses[0].JSONBody.identity.nativeConversationId}&id=${probeTurn2.Responses[0].JSONBody.rootTurn.assistant.final.messageId}
      Expect:
        Code: 200
        JSONBody:
          '@exists@Rows[0].turnId': true
      Header:
        Authorization:
        - Bearer ${mintCanonicalOwner.TokenString}
  verifyTurn2ToolOp:
    when: $sdkKey != ''
    action: http/runner:send
    description: tool result reuse responses - second turn should not emit a new tool
      call
    requests:
    - Method: GET
      URL: ${authServerURL}/v1/messages?conversationId=${setupTurn1.Responses[0].JSONBody.identity.nativeConversationId}&turnId=${turn2Message.Responses[0].JSONBody.Rows[0].turnId}&types=tool_op
      Expect:
        Code: 200
        JSONBody:
          HasMore: false
          '@exists@Rows[0]': false
      Header:
        Authorization:
        - Bearer ${mintCanonicalOwner.TokenString}
