pipeline:
  mintToken:
    action: secret:signJWT
    expiryInSec: 3600
    PrivateKey:
      URL: ${jwtPrivKey}
    claimsMap:
      sub: e2e-elicitation-accept
      email: e2e-elicitation-accept@example.test
  canonical020:
    action: http/runner:send
    TimeoutMs: 240000
    requests:
    - Method: POST
      URL: ${aguiProbeURL}/run
      Header:
        Authorization: ["Bearer ${mintToken.TokenString}"]
      JSONBody:
        target: ${authServerURL}
        probeId: canonical-focused-020
        query:
          agentId: elicitation_favorite_color
          query: describe my favourite color in 3 sentences
          elicitationMode: deferred
      Expect:
        Code: 200
        JSONBody:
          "@exists@identity.nativeConversationId": true
          "@exists@transcript.conversation.turns[0].elicitation.elicitationId": true
          outcome:
            type: interrupt
          http:
            - method: POST
              path: /v1/conversations
              statusCode: 200
            - method: GET
              statusCode: 200
            - method: POST
              path: /v1/ag-ui/run
              statusCode: 200
            - method: GET
              statusCode: 200
          "@exists@events[0]": true
  verifyStructuredElicitation:
    action: http/runner:send
    requests:
    - Method: GET
      URL: ${authServerURL}/v1/conversations/${canonical020.Responses[0].JSONBody.identity.nativeConversationId}/transcript
      Header:
        Authorization: ["Bearer ${mintToken.TokenString}"]
      Expect:
        Code: 200
        Body: /Please provide your favorite color so I can describe it in 3 sentences./
  resolveAccept:
    action: http/runner:send
    requests:
    - Method: POST
      URL: ${authServerURL}/v1/elicitations/${canonical020.Responses[0].JSONBody.identity.nativeConversationId}/${canonical020.Responses[0].JSONBody.transcript.conversation.turns[0].elicitation.elicitationId}/resolve
      Header:
        Authorization: ["Bearer ${mintToken.TokenString}"]
      JSONBody:
        action: accept
        payload:
          favoriteColor: blue
      Expect:
        Code: 200
        JSONBody:
          status: ok
  verifyAcceptedMessage:
    action: http/runner:send
    requests:
    - Method: GET
      URL: ${authServerURL}/v1/messages?conversationId=${canonical020.Responses[0].JSONBody.identity.nativeConversationId}&roles=assistant&types=text
      Header:
        Authorization: ["Bearer ${mintToken.TokenString}"]
      Expect:
        Code: 200
        JSONBody:
          Rows:
            "@indexBy@": elicitationId
            "${canonical020.Responses[0].JSONBody.transcript.conversation.turns[0].elicitation.elicitationId}":
              status: accepted
              "@exists@elicitationPayloadId": true
  verifyUserElicitationResponse:
    action: http/runner:send
    requests:
    - Method: GET
      URL: ${authServerURL}/v1/messages?conversationId=${canonical020.Responses[0].JSONBody.identity.nativeConversationId}&roles=user&types=elicitation_response
      Header:
        Authorization: ["Bearer ${mintToken.TokenString}"]
      Expect:
        Code: 200
        Body: /favoriteColor/
