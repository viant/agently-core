pipeline:
  mintToken:
    when: $sdkKey != ''
    action: secret:signJWT
    description: "elicitation fixture - mint matching owner JWT"
    expiryInSec: 3600
    PrivateKey:
      URL: ${jwtPrivKey}
    claimsMap:
      sub: e2e-mcp-form-roundtrip
      email: e2e-mcp-form-roundtrip@example.test

  createConversation:
    when: $sdkKey != ''
    action: http/runner:send
    description: "mcp form round-trip - create conversation"
    requests:
      - Method: POST
        URL: ${authServerURL}/v1/conversations
        Header:
          Authorization: ["Bearer ${mintToken.TokenString}"]
        JSONBody:
          AgentID: simple
          Title: mcp-form-roundtrip
        Expect:
          Code: 200
          JSONBody:
            "@exists@id": true

  roundTrip:
    multiAction: true
    startToolCall:
      when: $sdkKey != ''
      action: http/runner:send
      async: true
      description: "mcp form round-trip - start async tool execute"
      requests:
        - Method: POST
          URL: ${authServerURL}/v1/tools/execute?conversationId=${createConversation.Responses[0].JSONBody.id}
          Header:
            Authorization: ["Bearer ${mintToken.TokenString}"]
          JSONBody:
            name: mcpform/ask_form
            args: {}

    waitToolCall:
      when: $sdkKey != ''
      action: nop
      sleepTimeMs: 1200

    pendingElicitation:
      when: $sdkKey != ''
      action: http/runner:send
      description: "mcp form round-trip - pending elicitation should be listed"
      requests:
        - Method: GET
          URL: ${authServerURL}/v1/elicitations?conversationId=${createConversation.Responses[0].JSONBody.id}
          Header:
            Authorization: ["Bearer ${mintToken.TokenString}"]
          Expect:
            Code: 200
            JSONBody:
              rows:
                "@indexBy@": elicitationId
                mcp-form-e2e-elicitation:
                  "@exists@messageId": true
                  "@exists@content": true

    resolveElicitation:
      when: $sdkKey != ''
      action: http/runner:send
      description: "mcp form round-trip - resolve pending elicitation"
      requests:
        - Method: POST
          URL: ${authServerURL}/v1/elicitations/${createConversation.Responses[0].JSONBody.id}/mcp-form-e2e-elicitation/resolve
          Header:
            Authorization: ["Bearer ${mintToken.TokenString}"]
          JSONBody:
            action: accept
            payload:
              favoriteColor: blue
          Expect:
            Code: 200
            JSONBody:
              status: ok

    verifyAcceptedMessage:
      when: $sdkKey != ''
      action: http/runner:send
      description: "mcp form round-trip - control message should be accepted"
      requests:
        - Method: GET
          URL: ${authServerURL}/v1/messages?conversationId=${createConversation.Responses[0].JSONBody.id}&roles=tool&types=control
          Header:
            Authorization: ["Bearer ${mintToken.TokenString}"]
          Expect:
            Code: 200
            JSONBody:
              Rows:
                "@indexBy@": elicitationId
                mcp-form-e2e-elicitation:
                  status: accepted
                  "@exists@elicitationPayloadId": true
