pipeline:
  mintCanonicalOwner:
    action: secret:signJWT
    expiryInSec: 3600
    PrivateKey:
      URL: ${jwtPrivKey}
    claimsMap:
      sub: e2e-test
      email: e2e-test@example.test
  createConversation:
    when: $sdkKey != ''
    action: http/runner:send
    description: streaming - create conversation
    requests:
    - Method: POST
      URL: ${authServerURL}/v1/conversations
      JSONBody:
        AgentID: simple
        Title: stream-test
      Expect:
        Code: 200
        JSONBody:
          '@exists@id': true
      Header:
        Authorization:
        - Bearer ${mintCanonicalOwner.TokenString}
  query:
    when: $sdkKey != ''
    action: http/runner:send
    description: streaming - query conversation
    requests:
    - Method: POST
      URL: ${aguiProbeURL}/run
      Header:
        Connection:
        - close
        Authorization:
        - Bearer ${mintCanonicalOwner.TokenString}
      JSONBody:
        target: ${authServerURL}
        probeId: 012_streaming-query
        query:
          agentID: simple
          conversationID: ${createConversation.Responses[0].JSONBody.id}
          query: Say hello
      Expect:
        Code: 200
        JSONBody:
          '@exists@assistantText': true
