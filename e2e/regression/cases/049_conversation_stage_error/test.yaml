init:
  turnSuffix: $FormatTime('now', 'yyyyMMdd-HHmmss-SSS')
pipeline:
  mintCanonicalOwner:
    action: secret:signJWT
    expiryInSec: 3600
    PrivateKey:
      URL: ${jwtPrivKey}
    claimsMap:
      sub: e2e-stage-test
      email: e2e-stage-test@example.test
  createConversation:
    when: $sdkKey != ''
    action: http/runner:send
    description: conversation stage error - create conversation
    requests:
    - Method: POST
      URL: ${authServerURL}/v1/conversations
      JSONBody:
        AgentID: simple
        Title: conversation-stage-error-e2e
      Expect:
        Code: 200
        JSONBody:
          '@exists@id': true
      Header:
        Authorization:
        - Bearer ${mintCanonicalOwner.TokenString}
  queryInvalidModel:
    when: $sdkKey != ''
    action: http/runner:send
    description: conversation stage error - invalid model override should fail
    requests:
    - Method: POST
      URL: ${aguiProbeURL}/run
      Header:
        Connection:
        - close
        Authorization:
        - Bearer ${mintCanonicalOwner.TokenString}
      JSONBody:
        target: ${authServerURL}
        probeId: 049_conversation_stage_error-queryInvalidModel
        query:
          conversationID: ${createConversation.Responses[0].JSONBody.id}
          agentID: simple
          messageID: e2e-stage-error-turn-${turnSuffix}
          query: Say hello in one short sentence.
          model: openai_model_does_not_exist
      Expect:
        Code: 200
        JSONBody:
          error:
            stage: observe
          '@exists@error.category': true
          identity:
            clientMessageId: e2e-stage-error-turn-${turnSuffix}
          '@exists@rootTurn.user.messageId': true
  verifyNativeUserIdentity:
    when: $sdkKey != ''
    action: validator:assert
    actual: ${queryInvalidModel.Responses[0].JSONBody.rootTurn.turnId}
    expect: ${queryInvalidModel.Responses[0].JSONBody.identity.nativeTurnId}
  waitForFailurePersistence:
    when: $sdkKey != ''
    action: nop
    sleepTimeMs: 1200
  verifyRejectedStarterMessage:
    when: $sdkKey != ''
    action: http/runner:send
    description: conversation stage error - starter user message should be rejected
    requests:
    - Method: GET
      URL: ${authServerURL}/v1/messages?conversationId=${createConversation.Responses[0].JSONBody.id}&roles=user&types=text
      Expect:
        Code: 200
        JSONBody:
          Rows:
            '@indexBy@': id
            ${queryInvalidModel.Responses[0].JSONBody.rootTurn.user.messageId}:
              status: rejected
              turnId: ${queryInvalidModel.Responses[0].JSONBody.identity.nativeTurnId}
      Header:
        Authorization:
        - Bearer ${mintCanonicalOwner.TokenString}
  getConversation:
    when: $sdkKey != ''
    action: http/runner:send
    description: conversation stage error - conversation and latest turn should be
      error
    requests:
    - Method: GET
      URL: ${authServerURL}/v1/conversations/${createConversation.Responses[0].JSONBody.id}
      Expect:
        Code: 200
        JSONBody:
          id: ${createConversation.Responses[0].JSONBody.id}
          stage: error
          transcript:
          - stage: error
            status: failed
      Header:
        Authorization:
        - Bearer ${mintCanonicalOwner.TokenString}
