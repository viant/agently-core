pipeline:
  mintCanonicalOwner:
    action: secret:signJWT
    expiryInSec: 3600
    PrivateKey:
      URL: ${jwtPrivKey}
    claimsMap:
      sub: e2e-queue-edit
      email: e2e-queue-edit@example.test
  createConversation:
    when: $sdkKey != ''
    action: http/runner:send
    description: tool approval queue edit fields - create conversation
    requests:
    - Method: POST
      URL: ${authServerURL}/v1/conversations
      JSONBody:
        AgentID: chatter_system_os_queue_edit
        Title: queue-approval-edit-fields-e2e
      Expect:
        Code: 200
        JSONBody:
          '@exists@id': true
      Header:
        Authorization:
        - Bearer ${mintCanonicalOwner.TokenString}
  startQueuedQuery:
    when: $sdkKey != ''
    action: http/runner:send
    description: tool approval queue edit fields - start query
    requests:
    - Method: POST
      URL: ${aguiProbeURL}/run
      Header:
        Connection:
        - close
        Authorization:
        - Bearer ${mintCanonicalOwner.TokenString}
      JSONBody:
        target: ${authServerURL}
        probeId: 065_tool_approval_queue_edit_fields-startQueuedQuery
        query:
          conversationID: ${createConversation.Responses[0].JSONBody.id}
          agentID: chatter_system_os_queue_edit
          query: What are my HOME, SHELL, and PATH environment variables?
      Expect:
        Code: 200
        JSONBody:
          outcome:
            type: interrupt
  waitForQueue:
    when: $sdkKey != ''
    action: nop
    sleepTimeMs: 3000
  listPendingApprovals:
    when: $sdkKey != ''
    action: http/runner:send
    description: tool approval queue edit fields - verify pending approval
    requests:
    - Method: GET
      URL: ${authServerURL}/v1/tool-approvals/pending?userId=e2e-queue-edit&conversationId=${createConversation.Responses[0].JSONBody.id}
      Expect:
        Code: 200
        JSONBody:
          '@exists@rows[0]': true
          '@exists@rows[0].metadata.approval.editors[0]': true
      Header:
        Authorization:
        - Bearer ${mintCanonicalOwner.TokenString}
  captureOriginalApproval:
    when: $sdkKey != ''
    action: http/runner:send
    description: freeze the actual owned original operation before approval
    requests:
    - Method: GET
      URL: ${aguiProbeURL}/approval-capture/065_tool_approval_queue_edit_fields-startQueuedQuery?id=${listPendingApprovals.Responses[0].JSONBody.rows[0].id}
      Header:
        Authorization: ["Bearer ${mintCanonicalOwner.TokenString}"]
      Expect:
        Code: 200
        JSONBody:
          tuple:
            owner: e2e-queue-edit
            approvalId: ${listPendingApprovals.Responses[0].JSONBody.rows[0].id}
            nativeConversationId: ${createConversation.Responses[0].JSONBody.id}
            nativeTurnId: ${startQueuedQuery.Responses[0].JSONBody.identity.nativeTurnId}
            '@exists@nativeOperationId': true
            '@exists@effectMessageId': true
            '@exists@publicToolCallId': true
            originalArgumentNames: [HOME, PATH, SHELL]
  approveEditedToolCall:
    when: $sdkKey != ''
    action: http/runner:send
    description: tool approval queue edit fields - approve with HOME and PATH only
    requests:
    - Method: POST
      URL: ${authServerURL}/v1/tool-approvals/${listPendingApprovals.Responses[0].JSONBody.rows[0].id}/decision
      JSONBody:
        action: approve
        userId: e2e-queue-edit
        editedFields:
          names:
          - HOME
          - PATH
      Expect:
        Code: 200
        JSONBody:
          status: ok
          protocol:
            '@exists@continuationRunId': true
            '@exists@remainingInterruptIds[0]': false
      Header:
        Authorization:
        - Bearer ${mintCanonicalOwner.TokenString}
  collectApprovalContinuation:
    when: $sdkKey != ''
    action: http/runner:send
    description: observe the successor owned by the actual HTTP approval command
    requests:
    - Method: POST
      URL: ${aguiProbeURL}/run
      Header:
        Authorization:
        - Bearer ${mintCanonicalOwner.TokenString}
      JSONBody:
        target: ${authServerURL}
        probeId: approval-continuation-65
        nativeConversationId: ${createConversation.Responses[0].JSONBody.id}
        attach:
          threadId: ${approveEditedToolCall.Responses[0].JSONBody.protocol.threadId}
          runId: ${approveEditedToolCall.Responses[0].JSONBody.protocol.continuationRunId}
      Expect:
        Code: 200
        JSONBody:
          outcome:
            type: success
  verifyOriginalApprovedEffect:
    when: $sdkKey != ''
    action: http/runner:send
    description: verify exact original committed receipt and canonical result event
    requests:
    - Method: GET
      URL: ${aguiProbeURL}/approval-receipt/065_tool_approval_queue_edit_fields-startQueuedQuery?id=${captureOriginalApproval.Responses[0].JSONBody.tuple.approvalId}&runProbe=approval-continuation-65&runId=${approveEditedToolCall.Responses[0].JSONBody.protocol.continuationRunId}
      Header:
        Authorization: ["Bearer ${mintCanonicalOwner.TokenString}"]
      Expect:
        Code: 200
        JSONBody:
          queueStatus: executed
          decision: approve
          effectCount: 1
          originalResultEventCount: 1
          recoveredTerminal: success
          tuple:
            owner: e2e-queue-edit
            approvalId: ${captureOriginalApproval.Responses[0].JSONBody.tuple.approvalId}
            nativeConversationId: ${captureOriginalApproval.Responses[0].JSONBody.tuple.nativeConversationId}
            nativeTurnId: ${captureOriginalApproval.Responses[0].JSONBody.tuple.nativeTurnId}
            nativeOperationId: ${captureOriginalApproval.Responses[0].JSONBody.tuple.nativeOperationId}
            publicToolCallId: ${captureOriginalApproval.Responses[0].JSONBody.tuple.publicToolCallId}
            effectMessageId: ${captureOriginalApproval.Responses[0].JSONBody.tuple.effectMessageId}
          approvedRequest:
            names: [HOME, PATH]
          actualResponse:
            values:
              '@exists@HOME': true
              '@exists@PATH': true
              '@exists@SHELL': false
  verifyQuotedHOME:
    action: validator:assert
    actual: ${verifyOriginalApprovedEffect.Responses[0].JSONBody.literalEffectContent}
    expect: '/"HOME"/'
  verifyQuotedPATH:
    action: validator:assert
    actual: ${verifyOriginalApprovedEffect.Responses[0].JSONBody.literalEffectContent}
    expect: '/"PATH"/'
  verifyNoQuotedSHELL:
    action: validator:assert
    actual: ${verifyOriginalApprovedEffect.Responses[0].JSONBody.literalEffectContent}
    expect: '!/"SHELL"/'
  observeOriginalFinalAssistant:
    when: $sdkKey != ''
    action: http/runner:send
    description: preserve original final assistant HOME/PATH and no SHELL assertions
    requests:
    - Method: GET
      URL: ${aguiProbeURL}/await-native/approval-continuation-65
      Header:
        Authorization: ["Bearer ${mintCanonicalOwner.TokenString}"]
      Expect:
        Code: 200
        JSONBody:
          nativeStatus: completed
          '@exists@literalFinalContent': true
  verifyOriginalAssistantQuotedHOME:
    when: $sdkKey != ''
    action: validator:assert
    actual: ${observeOriginalFinalAssistant.Responses[0].JSONBody.literalFinalContent}
    expect: '/"HOME"/'
  verifyOriginalAssistantQuotedPATH:
    when: $sdkKey != ''
    action: validator:assert
    actual: ${observeOriginalFinalAssistant.Responses[0].JSONBody.literalFinalContent}
    expect: '/"PATH"/'
  verifyOriginalAssistantNoQuotedSHELL:
    when: $sdkKey != ''
    action: validator:assert
    actual: ${observeOriginalFinalAssistant.Responses[0].JSONBody.literalFinalContent}
    expect: '!/"SHELL"/'
