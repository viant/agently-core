pipeline:
  mintCanonicalOwner:
    action: secret:signJWT
    expiryInSec: 3600
    PrivateKey:
      URL: ${jwtPrivKey}
    claimsMap:
      sub: e2e-test
      email: e2e-test@example.test
  turn1:
    when: $sdkKey != ''
    action: http/runner:send
    description: 'multi-turn - turn 1: introduce name'
    requests:
    - Method: POST
      URL: ${aguiProbeURL}/run
      Header:
        Connection:
        - close
        Authorization:
        - Bearer ${mintCanonicalOwner.TokenString}
      JSONBody:
        target: ${authServerURL}
        probeId: 004_multi_turn-turn1
        query:
          agentID: simple
          query: My name is Alice. Please remember that.
      Expect:
        Code: 200
        JSONBody:
          '@exists@identity.nativeConversationId': true
          '@exists@assistantText': true
  turn2:
    when: $sdkKey != ''
    action: http/runner:send
    description: 'multi-turn - turn 2: recall name'
    requests:
    - Method: POST
      URL: ${aguiProbeURL}/run
      Header:
        Connection:
        - close
        Authorization:
        - Bearer ${mintCanonicalOwner.TokenString}
      JSONBody:
        target: ${authServerURL}
        probeId: 004_multi_turn-turn2
        query:
          agentID: simple
          conversationID: ${turn1.Responses[0].JSONBody.identity.nativeConversationId}
          query: What is my name?
      Expect:
        Code: 200
        JSONBody:
          assistantText: /Alice/
