---
init:
  repoPath: $WorkingDirectory(./..)
pipeline:
  buildDatly:
    action: exec:run
    TimeoutMs: 180000
    checkError: true
    commands:
    - cd $repoPath
    - export PATH=/usr/local/go/bin:$PATH
    - export GOPATH=${env.GOPATH}
    - mkdir -p $repoPath/e2e/bin
    - env GOWORK=off go build -o $repoPath/e2e/bin/datly ./e2e/cli/datlycmd
  buildApp:
    action: exec:run
    TimeoutMs: 180000
    checkError: true
    commands:
    - cd $repoPath
    - export PATH=/usr/local/go/bin:$PATH
    - export GOPATH=${env.GOPATH}
    - mkdir -p $repoPath/e2e/bin
    - env GOWORK=off go build -o $repoPath/e2e/bin/agently-app ./e2e/cli/agently-app
  build:
    action: exec:run
    TimeoutMs: 120000
    checkError: true
    commands:
    - cd ${repoPath}
    - mkdir -p ${repoPath}/e2e/bin
    - env GOWORK=off go build -o ${repoPath}/e2e/bin/mcpserver
      ./e2e/cli/mcpserver
    - cp ${repoPath}/e2e/bin/mcpserver ${repoPath}/e2e/bin/mcp-resources
    - cp ${repoPath}/e2e/bin/mcpserver ${repoPath}/e2e/bin/mcp-elicitation-form
    - cp ${repoPath}/e2e/bin/mcpserver ${repoPath}/e2e/bin/mcp-elicitation-oob
    - cp ${repoPath}/e2e/bin/mcpserver ${repoPath}/e2e/bin/mcp-approval-tool
    - cp ${repoPath}/e2e/bin/mcpserver ${repoPath}/e2e/bin/mcp-large-result
  buildAGUIProbe:
    action: exec:run
    TimeoutMs: 180000
    checkError: true
    commands:
    - cd ${repoPath}
    - env GOWORK=off go build -o ${repoPath}/e2e/bin/agui-probe ./e2e/cli/agui_probe
