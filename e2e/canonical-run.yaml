# Canonical source migration; execution requires an explicitly owned fixture.
# The external acceptance launcher creates a fresh schema once; this workflow
# never creates, drops, resets or reinitializes a database.
init:
  repoPath: $WorkingDirectory(./..)
  testdataPath: ${repoPath}/e2e/query/testdata
  ownedRoot: ${env.CORE_ENDLY_ROOT}
  workspacePath: ${ownedRoot}/workspace/.agently
  serverPort: 29501
  authServerPort: 29502
  debugger: 'off'
  sdkKey: configured
pipeline:
  preflight:
    action: exec:run
    checkError: true
    commands:
      - ${repoPath}/e2e/scripts/owned_endly_preflight.py
  rule:
    native:
      action: run
      request: '@rule/native'
  build:
    binaries:
      action: run
      request: '@build/build'
  test:
    action: run
    request: '@regression/regression'
  cleanup:
    action: exec:run
    checkError: true
    commands:
      - ${repoPath}/e2e/scripts/owned_endly_cleanup.sh
