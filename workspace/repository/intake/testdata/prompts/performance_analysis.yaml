id: performance_analysis
name: Performance Analysis
description: "Use when the user asks about system health or performance trends."
model: openai_gpt-5_6_terra
appliesTo:
  - performance
  - health
evidenceContract:
  required:
    - hierarchy
    - performance_summary
  optional:
    - segment_summary
  forbidden:
    - action_only
  completion:
    - emit DATA:hierarchy
    - emit at least one performance block
messages:
  - role: system
    text: $import(../shared/system.txt)
  - role: user
    text: $import(../shared/user.txt)
toolBundles:
  - analyst-performance-tools
template: analytics_dashboard
templates:
  - analytics_dashboard
  - resource_list_review
knowledge:
  - rootIds: [product-knowledge]
    maxDocuments: 3
    minScore: 0.55
