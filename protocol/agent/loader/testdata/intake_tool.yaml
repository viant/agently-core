id: intake-tool-agent
name: Intake Tool Agent
modelRef: gpt-4o
intake:
  enabled: true
  model: haiku
  modelDirectAction:
    allowedTools: [resources/read]
    requiredProfileId: workspace_ui
    minConfidence: 0.9
    timeoutSec: 30
  tool:
    bundles:
      - system/exec
    items:
      - name: resources/read
