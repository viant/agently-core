<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="700" viewBox="0 0 1040 700" role="img" aria-labelledby="title desc">
<title id="title">Agently Core architecture</title>
<desc id="desc">Applications enter through an embedded Go host or authenticated AG-UI and application APIs. Workspace configuration supplies the runtime. Agent orchestration owns context and the model/tool loop, with policy, human interaction, goals and scheduling. Provider and tool adapters connect external systems; SQLite or MySQL retains execution state. Clients consume canonical transcripts and application presentation.</desc>
