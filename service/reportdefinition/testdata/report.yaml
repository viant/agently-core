apiVersion: reporting.viant.ai/v1alpha1
kind: ReportDefinition
metadata:
  id: operations-overview-demo
  title: Operations Overview Preview
  description: Renderer-neutral operations report.
  revision: 1
parameters:
  - {name: from, type: date, label: From}
  - {name: to, type: date, label: To}
  - {name: region, type: string, label: Region, multiple: true}
endpoints:
  reports:
    type: mcp
    transport: streamable
    baseURL: /mcp
dataSources:
  operations:
    service: {endpoint: reports, uri: operations, method: POST}
    resultContract: {shape: tabular, resultsPath: data, resultName: operations}
    columns:
      - {name: operationsDate, type: date, role: dimension, label: Operations Date, nullable: false}
      - {name: region, type: string, role: dimension, label: Region, nullable: false}
      - {name: processedUnits, type: integer, role: measure, label: Processed Units, format: compactNumber, nullable: false}
      - {name: operatingCost, type: number, role: measure, label: Operating Cost, format: currency, nullable: false}
    parameterBindings:
      - {parameter: from, field: operationsDate, operator: gte}
      - {parameter: to, field: operationsDate, operator: lte}
      - {parameter: region, field: region, operator: in}
  projectTargets:
    service: {endpoint: reports, uri: projectTargets, method: POST}
    resultContract: {shape: records, rowPath: rows, hasMorePath: hasMore}
    columns:
      - {name: project, type: string, role: dimension, label: Project, nullable: false}
      - {name: targetUnits, type: integer, role: measure, label: Target Units, format: compactNumber, nullable: false}
datasets:
  operationsSummary:
    dataSource: operations
    query:
      projection:
        dimensions: []
        measures:
          - {field: processedUnits, aggregation: sum}
          - {field: operatingCost, aggregation: sum}
  operationsByDate:
    dataSource: operations
    query:
      projection:
        dimensions: [operationsDate]
        measures:
          - {field: processedUnits, aggregation: sum}
      orderBy:
        - {field: operationsDate, direction: asc}
      page: {limit: 2, offset: 0}
  operationsEvidence:
    dataSource: operations
    query:
      projection:
        dimensions: [operationsDate, region]
        measures:
          - {field: processedUnits, aggregation: sum}
          - {field: operatingCost, aggregation: sum}
      page: {limit: 2, offset: 0}
  targets:
    dataSource: projectTargets
    query:
      projection:
        dimensions: [project]
        measures:
          - {field: targetUnits, aggregation: none}
      page: {limit: 25, offset: 0}
sections:
  - id: overview
    title: Overview
    blocks:
      - id: operationsKpis
        type: kpiGroup
        title: Operations summary
        dataset: operationsSummary
        metrics:
          - {field: processedUnits, label: Processed Units, format: compactNumber}
          - {field: operatingCost, label: Operating Cost, format: currency}
      - id: operationsTrend
        type: chart
        title: Operations trend
        dataset: operationsByDate
        visual:
          type: line
          category: operationsDate
          series: [processedUnits]
  - id: evidence
    title: Evidence
    blocks:
      - id: operationsTable
        type: table
        title: Daily operations
        dataset: operationsEvidence
        columns: [operationsDate, region, processedUnits, operatingCost]
        paging: {enabled: true}
      - id: targetTable
        type: table
        title: Project targets
        dataset: targets
        columns: [project, targetUnits]
exports:
  formats: [pdf, csv, xlsx]
  useResolvedDatasets: true
